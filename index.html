<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>You are an idiot!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            cursor: crosshair;
        }

        body {
            overflow: hidden;
            background: black;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Monaco', monospace;
            height: 100vh;
            width: 100vw;
        }

        /* flashing background - classic youareanidiot */
        .flash-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: red;
            animation: flash 0.05s infinite alternate;
        }

        @keyframes flash {
            0% { background-color: #ff0000; }
            25% { background-color: #00ff00; }
            50% { background-color: #ffff00; }
            75% { background-color: #ff00ff; }
            100% { background-color: #0000ff; }
        }

        /* flying texts layer */
        .chaos-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        .insult-word {
            position: absolute;
            font-weight: bold;
            white-space: nowrap;
            font-family: 'Impact', 'Comic Sans MS', cursive;
            text-shadow: 2px 2px 0px black;
            pointer-events: none;
            z-index: 30;
        }

        /* main center message */
        .center-idiot {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: white;
            background: rgba(0,0,0,0.75);
            padding: 20px 40px;
            border: 5px solid yellow;
            border-radius: 40px;
            text-align: center;
            z-index: 50;
            white-space: nowrap;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            animation: pulse 0.2s infinite alternate;
            pointer-events: none;
            backdrop-filter: blur(3px);
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 5px red; border-color: yellow; }
            100% { text-shadow: 0 0 20px crimson; border-color: lime; }
        }

        /* IPv6 panel (üstte sabit) */
        .ipv6-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: black;
            color: lime;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 20px;
            border: 2px solid red;
            border-radius: 8px;
            z-index: 100;
            backdrop-filter: blur(8px);
            background-color: rgba(0,0,0,0.8);
            box-shadow: 0 0 15px rgba(255,0,0,0.6);
            pointer-events: none;
            animation: glitchBorder 0.4s infinite;
        }

        @keyframes glitchBorder {
            0% { border-color: red; color: lime; }
            50% { border-color: yellow; color: cyan; }
            100% { border-color: magenta; color: white; }
        }

        .redirect-timer {
            position: fixed;
            bottom: 30px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #ffaa00;
            font-family: monospace;
            font-size: 14px;
            padding: 8px 15px;
            border-left: 4px solid red;
            z-index: 100;
            font-weight: bold;
            pointer-events: none;
        }

        /* fake cursor */
        .fake-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            animation: cursorShake 0.08s infinite;
        }

        @keyframes cursorShake {
            0% { transform: translate(1px, -1px); }
            100% { transform: translate(-1px, 1px); }
        }

        /* badge like youareanidiot */
        .badge {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: black;
            color: lime;
            font-family: monospace;
            font-weight: bold;
            padding: 4px 10px;
            z-index: 200;
            font-size: 12px;
            border: 1px solid red;
            animation: blink 0.3s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; background: black; color: red; }
            50% { opacity: 0.6; background: maroon; color: yellow; }
        }

        /* about legacy safe text - screenshot'taki gibi */
        .legacy-note {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #ccc;
            font-size: 11px;
            font-family: monospace;
            padding: 5px 10px;
            border-radius: 6px;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="flash-bg"></div>
<div class="chaos-layer" id="chaosContainer"></div>
<div class="center-idiot" id="mainIdiot">YOU ARE AN IDIOT!</div>
<div class="ipv6-panel" id="ipv6Display">🌐 IPv6: sorgulanıyor...</div>
<div class="redirect-timer" id="timerMsg">⏳ 5 saniye içinde yönlendiriliyorsunuz...</div>
<div class="fake-cursor" id="fakeCursor"></div>
<div class="badge">⚠️ youareanidiot.cc ⚠️</div>
<div class="legacy-note">about legacy safe | classic virus</div>

<script>
    (function() {
        // ---------- 1) CLASSIC INFINITE ALERTS (youareanidiot ruhu) ----------
        function startInfiniteAlerts() {
            function nextAlert() {
                alert("You are an idiot!");
                setTimeout(nextAlert, 0);
            }
            nextAlert();
        }

        // ---------- 2) FLYING "you are an idiot" TEXTS ----------
        let flyingItems = [];

        function randomColor() {
            const colors = ["#ff0000", "#ffff00", "#00ff00", "#ff00ff", "#00ffff", "#ff6600", "#ff0066"];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function createFlyingTexts() {
            const container = document.getElementById('chaosContainer');
            const count = 140;  // bol miktarda uçan metin
            for (let i = 0; i < count; i++) {
                const div = document.createElement('div');
                div.className = 'insult-word';
                div.innerText = "You are an idiot!";
                div.style.color = randomColor();
                div.style.fontSize = (Math.random() * 28 + 18) + 'px';
                div.style.opacity = 0.7 + Math.random() * 0.3;
                div.style.fontWeight = '900';
                const startX = Math.random() * window.innerWidth;
                const startY = Math.random() * window.innerHeight;
                div.style.left = startX + 'px';
                div.style.top = startY + 'px';
                div.style.transform = `rotate(${Math.random() * 360}deg)`;
                container.appendChild(div);

                const vx = (Math.random() - 0.5) * 2.5;
                const vy = (Math.random() - 0.5) * 2.5;
                flyingItems.push({
                    el: div,
                    vx: vx,
                    vy: vy,
                    width: div.offsetWidth,
                    height: div.offsetHeight
                });
            }
        }

        function updateDimensions() {
            for (let obj of flyingItems) {
                obj.width = obj.el.offsetWidth;
                obj.height = obj.el.offsetHeight;
            }
        }

        function animateFlying() {
            for (let obj of flyingItems) {
                let left = parseFloat(obj.el.style.left);
                let top = parseFloat(obj.el.style.top);
                if (isNaN(left)) left = 0;
                if (isNaN(top)) top = 0;

                left += obj.vx;
                top += obj.vy;

                if (left <= 0) {
                    left = 0;
                    obj.vx = -obj.vx;
                    obj.el.style.color = randomColor();
                }
                if (left + obj.width >= window.innerWidth) {
                    left = window.innerWidth - obj.width;
                    obj.vx = -obj.vx;
                    obj.el.style.color = randomColor();
                }
                if (top <= 0) {
                    top = 0;
                    obj.vy = -obj.vy;
                    obj.el.style.color = randomColor();
                }
                if (top + obj.height >= window.innerHeight) {
                    top = window.innerHeight - obj.height;
                    obj.vy = -obj.vy;
                    obj.el.style.color = randomColor();
                }

                obj.el.style.left = left + 'px';
                obj.el.style.top = top + 'px';

                let rotate = Math.sin(Date.now() * 0.005 + left) * 15;
                obj.el.style.transform = `rotate(${rotate}deg)`;
            }
            requestAnimationFrame(animateFlying);
        }

        // ---------- 3) FAKE CURSOR (bozulmuş fare takip) ----------
        function initFakeCursor() {
            const cursor = document.getElementById('fakeCursor');
            document.addEventListener('mousemove', (e) => {
                if (cursor) {
                    cursor.style.left = (e.clientX - 10) + 'px';
                    cursor.style.top = (e.clientY - 10) + 'px';
                }
            });
            setInterval(() => {
                if (cursor) {
                    cursor.style.background = `hsl(${Math.random() * 360}, 100%, 60%)`;
                }
            }, 100);
        }

        // ---------- 4) TITLE MADNESS (youareanidiot klasik) ----------
        function changeTitle() {
            const titles = [
                "You are an idiot!",
                "IDIOT",
                "youareanidiot.cc",
                "STUPID",
                "INFECTED",
                "YOU ARE AN IDIOT"
            ];
            let idx = 0;
            setInterval(() => {
                document.title = titles[idx % titles.length];
                idx++;
            }, 300);
        }

        // ---------- 5) PREVENT RIGHT CLICK ----------
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            alert("You are an idiot!");
            return false;
        });

        // ---------- 6) BEFOREUNLOAD TRAP ----------
        window.addEventListener('beforeunload', function (e) {
            const msg = "You are an idiot!";
            e.returnValue = msg;
            return msg;
        });

        // ---------- 7) RESIZE HANDLER ----------
        window.addEventListener('resize', () => {
            updateDimensions();
            for (let obj of flyingItems) {
                let left = parseFloat(obj.el.style.left);
                let top = parseFloat(obj.el.style.top);
                if (left + obj.width > window.innerWidth) {
                    obj.el.style.left = (window.innerWidth - obj.width) + 'px';
                }
                if (top + obj.height > window.innerHeight) {
                    obj.el.style.top = (window.innerHeight - obj.height) + 'px';
                }
            }
        });

        // ---------- 8) IPv6 GÖSTERME (public IPv6, ipify API) ----------
        function fetchIPv6() {
            const ipv6Element = document.getElementById('ipv6Display');
            // ipify.org IPv6 endpoint
            fetch('https://api6.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    if (data.ip) {
                        ipv6Element.innerHTML = `🌐 IPv6: ${data.ip}`;
                    } else {
                        ipv6Element.innerHTML = `🌐 IPv6: algılanamadı (IPv4 üzerinden)`;
                    }
                })
                .catch(err => {
                    console.error("IPv6 sorgulama hatası", err);
                    ipv6Element.innerHTML = `🌐 IPv6: tespit edilemedi (WebRTC veya ağ hatası)`;
                    // fallback: WebRTC ile yerel IPv6 göstermeyi dene (opsiyonel)
                    tryGetLocalIPv6();
                });
        }

        // WebRTC ile yerel IPv6 adreslerini bulmak için fallback (sadece ek bilgi)
        function tryGetLocalIPv6() {
            const ipv6Element = document.getElementById('ipv6Display');
            if (ipv6Element.innerText.includes("algılanamadı") || ipv6Element.innerText.includes("tespit edilemedi")) {
                // WebRTC ile yerel ipv6 adreslerini topla (isteğe bağlı)
                const pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                pc.onicecandidate = (ice) => {
                    if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                    const candidate = ice.candidate.candidate;
                    const ipv6Match = candidate.match(/([a-f0-9:]+:+)+[a-f0-9]+/i);
                    if (ipv6Match && ipv6Match[0]) {
                        ipv6Element.innerHTML = `🌐 IPv6 (yerel): ${ipv6Match[0]}`;
                        pc.close();
                    }
                };
                setTimeout(() => pc.close(), 1500);
            }
        }

        // ---------- 9) 5 SANİYE SONRA GOOGLE DRIVE YÖNLENDİRMESİ ----------
        const DRIVE_LINK = "https://drive.google.com/file/d/1Hkp7f6dNtqkdjwr6N43osVsVb6a4mbCo/view?usp=drivesdk";
        let redirectTimer = null;
        let secondsLeft = 5;
        const timerElement = document.getElementById('timerMsg');

        function startRedirectCountdown() {
            if (redirectTimer) clearInterval(redirectTimer);
            const interval = setInterval(() => {
                secondsLeft--;
                if (timerElement) {
                    timerElement.innerHTML = `⏳ ${secondsLeft} saniye içinde yönlendiriliyorsunuz... (drive.google.com)`;
                }
                if (secondsLeft <= 0) {
                    clearInterval(interval);
                    if (timerElement) timerElement.innerHTML = `🚀 Yönlendiriliyor...`;
                    // yönlendirme işlemi
                    window.location.href = DRIVE_LINK;
                }
            }, 1000);
            redirectTimer = interval;
        }

        // ---------- 10) ANIMATE CENTER MESSAGE (klasik youareanidiot yazısı) ----------
        function animateCenterText() {
            const centerDiv = document.getElementById('mainIdiot');
            const messages = [
                "YOU ARE AN IDIOT!",
                "youareanidiot.cc",
                "😂 IDIOT 😂",
                "⚠️ VIRUS ⚠️",
                "KEEP CALM? NO!",
                "YOU ARE AN IDIOT!"
            ];
            let idx = 0;
            setInterval(() => {
                if (centerDiv) {
                    centerDiv.innerHTML = messages[idx % messages.length];
                    idx++;
                }
            }, 700);
        }

        // ---------- 11) BONUS: KLAVYE TUŞLARINI BOZMA HAVASI (console spam değil ama zararsız) ----------
        function blockKeys() {
            window.addEventListener('keydown', function(e) {
                // F5, Ctrl+R gibi yenileme tuşlarını engellemeye çalış (kullanıcıyı sinir etmek için)
                if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.ctrlKey && e.key === 'R')) {
                    e.preventDefault();
                    alert("You are an idiot!");
                }
                // Backspace, Escape vb de sinyal versin
                if (e.key === 'Escape') {
                    alert("You are an idiot!");
                }
            });
        }

        // ---------- TÜM VİRÜS ETKİNLİKLERİNİ BAŞLAT ----------
        function fullInfection() {
            createFlyingTexts();
            animateFlying();
            initFakeCursor();
            changeTitle();
            startInfiniteAlerts();      // sonsuz alert seli
            fetchIPv6();                // IPv6 gösterimi
            startRedirectCountdown();   // 5 sn sonra drive linki
            animateCenterText();
            blockKeys();

            // Ekstra: "about legacy safe" hissi için konsola yaz
            console.log("%c⚠️ youareanidiot.cc | IPv6 gösteriliyor, 5 saniye sonra yönlendirme ⚠️", "color: red; font-size: 14px");
        }

        window.addEventListener('load', () => {
            fullInfection();
        });
    })();
</script>
</body>
  </html>
